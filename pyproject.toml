[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airp"
version = "0.1.0"
description = "AIRP content-neutral Agent Framework and RP adapters"
requires-python = ">=3.11"

[project.scripts]
airp-runtime = "airp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airp = ["web/**/*", "resources/**/*"]

[tool.setuptools.exclude-package-data]
airp = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
